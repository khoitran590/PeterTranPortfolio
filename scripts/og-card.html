<!DOCTYPE html>
<!--
  Source for public/assets/og-image.png (the link-preview card).
  To regenerate after editing: open this file at exactly 1200x630 and screenshot
  it, or run it through any headless-browser screenshot tool.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        background: #0a0a0a; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex; align-items: center;
        position: relative;
      }
      /* Same 48px rule grid as the site background */
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,.075) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.075) 1px, transparent 1px);
        background-size: 48px 48px;
        -webkit-mask-image: linear-gradient(to bottom, #000, rgba(0,0,0,.75) 70%, transparent);
      }
      .orb {
        position: absolute; width: 520px; height: 520px; border-radius: 50%;
        filter: blur(80px); opacity: .5;
      }
      .orb-a { top: -180px; left: -120px; background: linear-gradient(135deg, #7dd3fc55, #818cf855); }
      .orb-b { bottom: -220px; right: -100px; background: linear-gradient(135deg, #f0abfc44, #fb718544); }
      .inner {
        position: relative; display: flex; align-items: center; gap: 64px;
        padding: 0 88px; width: 100%;
      }
      img {
        width: 260px; height: 260px; border-radius: 50%; object-fit: cover;
        box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
        outline: 1px solid rgba(255,255,255,.18); outline-offset: -1px;
        flex-shrink: 0;
      }
      .kicker {
        color: #818cf8; font-size: 20px; font-weight: 700;
        letter-spacing: .14em; text-transform: uppercase; margin-bottom: 18px;
      }
      h1 { font-size: 92px; line-height: .95; letter-spacing: -.035em; font-weight: 800; }
      .role { margin-top: 22px; font-size: 30px; font-weight: 600; color: rgba(255,255,255,.78); }
      .stack {
        margin-top: 34px; display: flex; gap: 10px; flex-wrap: wrap;
      }
      .stack span {
        font-size: 19px; font-weight: 600; color: rgba(255,255,255,.82);
        background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
        padding: 8px 16px; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="inner">
      <img src="../public/assets/peter-portrait.jpg" alt="" />
      <div>
        <p class="kicker">Software Engineering Portfolio</p>
        <h1>Peter Tran</h1>
        <p class="role">Web, mobile, and product-minded development</p>
        <div class="stack">
          <span>React</span><span>React Native</span><span>TypeScript</span>
          <span>Node.js</span><span>SwiftUI</span><span>SQL</span>
        </div>
      </div>
    </div>
  </body>
</html>
